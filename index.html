<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verbouwplan begane grond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}

/* Layout: werkbalk boven; bibliotheek links, tekening midden, eigenschappen rechts. Telefoon: tekening vol, panelen als onderblad. */
:root{
  --paper:#E9EDEA; --sheet:#F7F9F7; --ink:#1E2327; --ink2:#5A656E; --line:#C8D0CB;
  --room:#E4EAE6; --wallfill:#9AA39E; --accent:#C2372B; --accent-soft:rgba(194,55,43,.14);
  --water:#2B6896; --water-soft:rgba(43,104,150,.10); --ok:#2E7A4E; --panel:#FFFFFF;
  --font-ui:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  /* 3D-maquette */
  --v3-wall:#EEEBE5; --v3-cut:#7B8287; --v3-bear:#40464B; --v3-new:#EDB8B0; --v3-bad:#E59A8F;
  --v3-wood:#CDB08A; --v3-tile:#D3DDE2; --v3-ktile:#DDD6CB; --v3-stone:#C4C2BD;
  --v3-porc:#FAFBFB; --v3-appl:#E3E6E8; --v3-metal:#A9B1B6; --v3-cab:#9C8670; --v3-dark:#3B4044;
  --v3-door:#F4F2EE; --v3-mirror:#B8C7CF; --v3-label:#2A3035; --v3-afvoer:#7A5A2F; --v3-gas:#C99A16;
  --v3-grass:#A3BA90; --v3-pave:#CFCBC3; --v3-street:#9EA3A6; --v3-ground:#DCD8CF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14181B; --sheet:#1B2024; --ink:#DDE2E5; --ink2:#95A0A8; --line:#343C42;
  --room:#232A2F; --wallfill:#5E686F; --accent:#F0695B; --accent-soft:rgba(240,105,91,.18);
  --water:#6FAAD9; --water-soft:rgba(111,170,217,.13); --ok:#6CC08F; --panel:#1F2529; color-scheme:dark; --v3-grass:#5F7552; --v3-pave:#6E6B66; --v3-street:#4D5256; --v3-ground:#4A4845}}
:root[data-theme="dark"]{
  --paper:#14181B; --sheet:#1B2024; --ink:#DDE2E5; --ink2:#95A0A8; --line:#343C42;
  --room:#232A2F; --wallfill:#5E686F; --accent:#F0695B; --accent-soft:rgba(240,105,91,.18);
  --water:#6FAAD9; --water-soft:rgba(111,170,217,.13); --ok:#6CC08F; --panel:#1F2529; color-scheme:dark; --v3-grass:#5F7552; --v3-pave:#6E6B66; --v3-street:#4D5256; --v3-ground:#4A4845}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:14px;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* werkbalk */
.bar{display:flex;align-items:center;gap:6px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.brand{font-weight:600;white-space:nowrap;margin-right:6px;letter-spacing:.01em}
.brand small{display:block;font-weight:400;color:var(--ink2);font-size:11px;font-family:var(--font-num)}
.grp{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:6px;flex:none}
.btn{border:0;background:transparent;padding:6px 9px;border-radius:4px;white-space:nowrap;font-size:13px}
.btn:hover{background:var(--room)}
.btn.on{background:var(--ink);color:var(--sheet)}
.btn.primary{background:var(--accent);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.sel{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;font-size:13px;flex:none;max-width:170px}
.sep{flex:1}
.onlymob{display:none}

/* hoofdgebied */
.main{display:grid;grid-template-columns:220px 1fr 290px;min-height:0}
.lib,.insp{background:var(--panel);overflow-y:auto;min-height:0}
.lib{border-right:1px solid var(--line);padding:12px}
.insp{border-left:1px solid var(--line);padding:14px}
.lib h3,.insp h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:500;margin:14px 0 6px}
.lib h3:first-child{margin-top:2px}
.libgrid{display:grid;grid-template-columns:1fr;gap:3px}
.li{display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-align:left;border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:5px}
.li:hover{border-color:var(--line);background:var(--sheet)}
.li span:last-child{font-family:var(--font-num);font-size:11px;color:var(--ink2)}
.hint{font-size:12px;color:var(--ink2);line-height:1.45}

.stage{position:relative;min-width:0;min-height:0;background:var(--sheet)}
svg#plan{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.legend{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:11px;color:var(--ink2);background:color-mix(in srgb,var(--sheet) 88%,transparent);padding:6px 8px;border-radius:5px;pointer-events:none;max-width:calc(100% - 20px)}
.legend i{display:inline-block;width:18px;height:9px;vertical-align:-1px;margin-right:4px;border:1px solid var(--ink)}
.lg-bear{background:repeating-linear-gradient(45deg,var(--ink) 0 1.5px,transparent 1.5px 4px)}
.lg-int{background:var(--wallfill)}
.lg-new{background:var(--accent-soft);border-color:var(--accent)!important}
.lg-demo{border:1.5px dashed var(--accent)!important}
.scale{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-num)}
.scale b{display:inline-block;height:6px;border:1.5px solid var(--ink);border-top:0}
.zoom{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:6px;font-size:16px}
.modehint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--sheet);font-size:12px;padding:5px 10px;border-radius:5px;pointer-events:none}

/* eigenschappen */
.ih{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ih h2{font-size:17px;font-weight:600;margin:0;text-wrap:balance}
.kind{font-size:11px;color:var(--ink2);font-family:var(--font-num)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:11px;color:var(--ink2)}
.f input{border:1px solid var(--line);background:var(--sheet);border-radius:5px;padding:6px 7px;font-family:var(--font-num);font-size:13px;width:100%;min-width:0}
.f.full{grid-column:1/-1}
.f.full input{font-family:var(--font-ui)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{border:1px solid var(--line);background:var(--sheet);border-radius:5px;padding:6px 10px;font-size:13px}
.pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pill.danger{color:var(--accent)}
.facts{margin-top:12px;display:grid;gap:6px}
.fact{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px dotted var(--line);padding-bottom:4px}
.fact b{font-family:var(--font-num);font-weight:500;white-space:nowrap}
.warn{margin-top:10px;border-left:3px solid var(--accent);background:var(--accent-soft);padding:7px 9px;font-size:12.5px;border-radius:0 5px 5px 0;line-height:1.4}
.okmsg{margin-top:10px;border-left:3px solid var(--ok);padding:6px 9px;font-size:12.5px;color:var(--ok)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--sheet);border-radius:5px;font-family:var(--font-num);font-size:11px;padding:6px;color:var(--ink)}
.mobhandle{display:none}

@media (max-width: 860px){
  .main{grid-template-columns:1fr;position:relative}
  .lib{position:absolute;inset:0 auto 0 0;width:min(280px,85vw);z-index:5;box-shadow:4px 0 18px rgba(0,0,0,.18);padding-left:max(12px,env(safe-area-inset-left,0px))}
  .lib:not(.open){display:none}
  .insp{position:absolute;left:0;right:0;bottom:0;z-index:4;max-height:46%;border-left:0;border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.14);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .insp.collapsed{max-height:44px;overflow:hidden}
  .mobhandle{display:block;width:100%;border:0;background:transparent;padding:0 0 6px;font-size:12px;color:var(--ink2);text-align:center}
  .onlymob{display:inline-block}
  .brand{display:none}
  .legend{bottom:auto;top:10px;left:max(10px,env(safe-area-inset-left,0px));max-width:calc(100% - 70px)}
}

/* SVG */
.gl{fill:none;stroke:var(--line);stroke-width:1px;vector-effect:non-scaling-stroke}
.roomf{fill:var(--room)}
.roomtxt{fill:var(--ink);font-family:var(--font-ui);font-weight:500;cursor:pointer}
.roomarea{fill:var(--ink2);font-family:var(--font-num)}
.wall{fill:var(--wallfill);stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke}
.wall.bear{fill:url(#hatch)}
.wall.new{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5px}
.wall.demo{fill:none;stroke:var(--accent);stroke-dasharray:5 4;stroke-width:1.3px}
.hatchl{stroke:var(--ink);stroke-width:22}
.hatchbg{fill:var(--sheet)}
.gap{fill:var(--sheet)}
.ln{fill:none;stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke}
.ln.thin{stroke-width:.7px}
.ln.new{stroke:var(--accent)}
.ln.demo{stroke:var(--accent);stroke-dasharray:4 3}
.fx{fill:var(--sheet);stroke:var(--ink);stroke-width:1.1px;vector-effect:non-scaling-stroke}
.fx.wet{stroke:var(--water)}
.fx.demo{stroke:var(--accent);stroke-dasharray:4 3;fill:none}
.fxt{fill:var(--ink2);font-family:var(--font-ui)}
.clr{fill:var(--water-soft);stroke:var(--water);stroke-dasharray:3 3;stroke-width:1px;vector-effect:non-scaling-stroke;pointer-events:none}
.clr.bad{fill:var(--accent-soft);stroke:var(--accent)}
.mk{stroke:var(--sheet);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.mk.afvoer{fill:#7A5A2F}.mk.water{fill:var(--water)}.mk.gas{fill:#C99A16}
.mkt{fill:var(--ink);font-family:var(--font-num)}
.hit{fill:transparent;stroke:transparent;stroke-width:14px;vector-effect:non-scaling-stroke;cursor:move}
.selbox{fill:none;stroke:var(--accent);stroke-width:1.5px;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;pointer-events:none}
.badbox{fill:none;stroke:var(--accent);stroke-width:2px;vector-effect:non-scaling-stroke;pointer-events:none}
.hd{fill:var(--sheet);stroke:var(--accent);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.dim{stroke:var(--accent);stroke-width:1px;vector-effect:non-scaling-stroke;fill:none;pointer-events:none}
.dimt{fill:var(--accent);font-family:var(--font-num);paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.ghost{fill:none;stroke:var(--ink2);stroke-width:1px;stroke-dasharray:2 3;vector-effect:non-scaling-stroke;opacity:.8;pointer-events:none}
.meas{stroke:var(--ink);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.meast{fill:var(--ink);font-family:var(--font-num);font-weight:500;paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.orient{fill:var(--ink2);font-family:var(--font-num);letter-spacing:.3em;pointer-events:none}
.li{align-items:center}
.li .ic{width:30px;height:24px;flex:none;display:block}
.li .nm{flex:1}
.lg-clr{background:var(--water-soft);border:1px dashed var(--water)!important}
.lg-dot{border-radius:50%;width:10px!important;height:10px!important;background:#7A5A2F;border:0!important}
.dist{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.dist div{background:var(--sheet);border:1px solid var(--line);border-radius:5px;padding:5px 4px;text-align:center;font-family:var(--font-num);font-size:12px}
.dist small{display:block;font-family:var(--font-ui);color:var(--ink2);font-size:10.5px}
details.pos{margin-top:10px}
details.pos summary{cursor:pointer;font-size:12px;color:var(--ink2)}
.callout{margin-top:10px;background:var(--room);border-radius:6px;padding:10px 11px;font-size:13px;line-height:1.45}
.callout b{display:block;margin-bottom:2px}
.pill.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.mobview{display:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:9px 12px;border-radius:7px;font-size:13px;display:flex;gap:12px;align-items:center;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{border:0;background:transparent;color:var(--sheet);text-decoration:underline;font-weight:600;padding:0;white-space:nowrap}
.intro{position:fixed;inset:0;z-index:40;background:rgba(15,20,24,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);color:var(--ink);border-radius:10px;max-width:440px;width:100%;padding:22px 22px 16px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:100%;overflow:auto}
.card .stepno{font-family:var(--font-num);font-size:11px;color:var(--ink2);letter-spacing:.08em}
.card h2{margin:4px 0 10px;font-size:21px;text-wrap:balance}
.card p,.card li{font-size:14.5px;line-height:1.5;margin:0 0 8px}
.card ul{padding-left:18px;margin:0 0 8px}
.card .sw{display:inline-block;width:14px;height:10px;vertical-align:0;margin-right:3px;border:1px solid var(--ink)}
.card .nav{display:flex;align-items:center;gap:8px;margin-top:16px}
.card .dots{display:flex;gap:5px;flex:1}
.card .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.card .dots i.on{background:var(--accent)}
.card .ill{background:var(--sheet);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;display:block;width:100%;height:auto}
@media (max-width: 860px){
  .grp.view,#snap,.grp.mode,#newVar{display:none}
  .mobview{display:block}
  .toast{top:calc(62px + env(safe-area-inset-top,0px));bottom:auto}
  .legend{display:none}
}
/* 3D */
.v3{position:absolute;inset:0;background:var(--sheet)}
.v3 canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
.v3bar{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.v3bar>*{pointer-events:auto;background:var(--panel)}
.v3bar>.btn{border:1px solid var(--line);border-radius:6px}
.v3hint{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:var(--sheet);font-size:12.5px;padding:6px 11px;border-radius:6px;pointer-events:none;max-width:calc(100% - 24px);text-align:center;line-height:1.4}
.v3msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink2);text-align:center;padding:24px;font-size:14px;line-height:1.5}
body.is3d #plan,body.is3d #legend2d,body.is3d .zoom,body.is3d #modehint,body.is3d .grp.mode,body.is3d #snap,body.is3d #tDims,body.is3d #tGhost,body.is3d #tLock{display:none!important}
@media (max-width: 860px){.v3hint{bottom:56px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="btn onlymob" id="libBtn">+ Toevoegen</button>
    <div class="brand">Verbouwplan<small>begane grond · maten in cm</small></div>
    <select class="sel" id="variant" aria-label="Variant"></select>
    <button class="btn" id="newVar" title="Kopie van huidige variant maken">+ Variant</button>
    <div class="grp" role="group" aria-label="Weergave">
      <button class="btn on" id="v2d" title="Plattegrond">2D</button>
      <button class="btn" id="v3d" title="Maquette in 3D">3D</button>
    </div>
    <div class="grp">
      <button class="btn" id="undo" title="Ongedaan maken (Ctrl+Z)">↶</button>
      <button class="btn" id="redo" title="Opnieuw (Ctrl+Y)">↷</button>
    </div>
    <div class="grp mode">
      <button class="btn on" id="mSel">Schuiven</button>
      <button class="btn" id="mMeas">Meetlint</button>
    </div>
    <select class="sel" id="snap" aria-label="Stapgrootte bij schuiven">
      <option value="10">stappen van 1 cm</option>
      <option value="50" selected>stappen van 5 cm</option>
      <option value="100">stappen van 10 cm</option>
    </select>
    <div class="grp view">
      <button class="btn on" id="tDims" title="Afstanden tot muren tonen">Maten</button>
      <button class="btn on" id="tClr" title="Benodigde vrije ruimte voor sanitair">Vrije ruimte</button>
      <button class="btn" id="tGhost" title="Bestaande situatie als stippellijn eronder">Bestaand</button>
      <button class="btn on" id="tLock" title="Muren kunnen niet per ongeluk verschuiven">Muren vast</button>
    </div>
    <button class="btn" id="help" title="Uitleg" aria-label="Uitleg" style="border:1px solid var(--line);border-radius:50%;width:32px;height:32px;padding:0;flex:none;font-weight:600">?</button>
  </div>
  <div class="main">
    <aside class="lib" id="lib"></aside>
    <div class="stage" id="stage">
      <svg id="plan" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <defs>
          <pattern id="hatch" patternUnits="userSpaceOnUse" width="110" height="110" patternTransform="rotate(45)">
            <rect class="hatchbg" width="110" height="110"/><line class="hatchl" x1="0" y1="0" x2="0" y2="110"/>
          </pattern>
          <pattern id="grid" patternUnits="userSpaceOnUse" width="1000" height="1000"><path class="gl" d="M1000 0H0V1000"/></pattern>
        </defs>
        <g id="world"></g>
      </svg>
      <div class="legend" id="legend2d">
        <span><i class="lg-bear"></i>dragend</span>
        <span><i class="lg-int"></i>binnenwand</span>
        <span><i class="lg-new"></i>nieuw</span>
        <span><i class="lg-demo"></i>slopen</span>
        <span><i class="lg-clr"></i>vrije ruimte</span>
        <span><i class="lg-dot"></i>afvoer</span>
        <span class="scale"><b id="scaleBar"></b>1 m</span>
      </div>
      <div class="zoom">
        <button id="zin" aria-label="Inzoomen">+</button>
        <button id="zout" aria-label="Uitzoomen">−</button>
        <button id="zfit" aria-label="Passend maken">⤢</button>
      </div>
      <div class="modehint" id="modehint" hidden>Sleep over de tekening om te meten</div>
      <div class="v3" id="v3" hidden>
        <canvas id="v3c" aria-label="3D-maquette van de begane grond"></canvas>
        <div class="v3bar">
          <div class="grp" role="group" aria-label="Kijkrichting">
            <button class="btn on" data-v3="schuin">Schuin</button>
            <button class="btn" data-v3="boven">Boven</button>
            <button class="btn" data-v3="tuin">Tuinzijde</button>
            <button class="btn" data-v3="straat">Straatzijde</button>
          </div>
          <button class="btn" id="v3eye" title="Sta op een plek in huis en kijk rond">Rondkijken</button>
          <button class="btn on" id="v3low" title="Muren halve hoogte, zodat je beter in de kamers kijkt">Muren laag</button>
          <button class="btn on" id="v3ghost" title="Wat je sloopt doorzichtig rood tonen">Sloop tonen</button>
        </div>
        <div class="legend" id="legend3d">
          <span><i class="lg-new"></i>nieuw</span>
          <span><i class="lg-demo"></i>slopen</span>
          <span><i class="lg-clr"></i>vrije ruimte</span>
          <span>Plafond 2,60 m · deuren 2,10 m</span>
        </div>

  W('wand hal / slaapkamer',4310,4200,100,5660), W('wand hal',3310,6930,1000,100),

  F('douche','douchebak',5780,-2610,900,900,0),
  F('toilet','toilet douche',5080,-2150,550,380,270),
  F('wastafel','wastafel',5130,-2610,500,400,0),
  F('wm','wasmachine portaal',6080,-1190,600,600,0),
  F('toilet2','toilet',6200,3000,380,680,0),

  F('koelkast','koelkast',4300,0,650,600,0),
  F('kast','moederhaard',0,5300,450,1100,270),
  M('afvoer','standleiding',6740,3990),

  M('gas','gasmeter',4520,9620),
];
BASE.forEach(o=>o.id=nid());

/* ---------- state ---------- */
const clone=o=>JSON.parse(JSON.stringify(o));
const KEY='verbouwplan-v1';
let store;
try{store=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const BASE_NAME='Bestaande situatie';
if(!store||!store.v){store={cur:BASE_NAME,v:{}}}
if(!store.v[BASE_NAME])store.v[BASE_NAME]=clone(BASE);

let items=store.v[store.cur];
let sel=null, hist=[], fut=[];
const opts={snap:50,dims:true,clr:true,ghost:false,lock:true,mode:'sel'};
let vb={x:-800,y:-3400,w:8500,h:14200};
const isMob=()=>window.innerWidth<=860;
let measure=null, insCollapsed=isMob(), delArm=null;

function save(){store.v[store.cur]=items;try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function nextName(){let i=1,n;do{n='Variant '+i++}while(store.v[n]);return n}
function snapshot(){
  if(store.cur===BASE_NAME){ // bestaande situatie blijft altijd intact
    const n=nextName();store.v[BASE_NAME]=clone(items);store.v[n]=items;store.cur=n;hist=[];fut=[];fillVariants();
    toast(`Je wijzigingen staan in “${n}”. De bestaande situatie blijft bewaard.`);forkAt=Date.now();
  }
  hist.push(JSON.stringify(items));if(hist.length>150)hist.shift();fut=[]}
let toastT,forkAt=0;
function toast(msg,actLabel,act){if(!actLabel&&Date.now()-forkAt<400)return;const t=document.getElementById('toast'),b=document.getElementById('toastAct');
  document.getElementById('toastMsg').textContent=msg;b.hidden=!actLabel;b.textContent=actLabel||'';b.onclick=()=>{t.hidden=true;act&&act()};
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,actLabel?6000:4500)}
function undo(){if(!hist.length)return;fut.push(JSON.stringify(items));items=JSON.parse(hist.pop());if(sel&&!byId(sel))sel=null;commit()}
function redo(){if(!fut.length)return;hist.push(JSON.stringify(items));items=JSON.parse(fut.pop());if(sel&&!byId(sel))sel=null;commit()}
const byId=id=>items.find(o=>o.id===id);
function commit(){save();render();panel()}

/* ---------- geometrie ---------- */
const svg=document.getElementById('plan'), world=document.getElementById('world');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const loc=it=>{const r=((it.rot||0)%180+180)%180;return r? {lw:it.h,lh:it.w}:{lw:it.w,lh:it.h}};
function rp(x,y,deg){const a=deg*Math.PI/180,c=Math.round(Math.cos(a)),s=Math.round(Math.sin(a));return[x*c-y*s,x*s+y*c]}
function clrBox(it){
  if(it.kind!=='fix'||it.demo)return null;const t=T[it.type];if(!t||!t.cl)return null;
  const {lw,lh}=loc(it),cx=it.x+it.w/2,cy=it.y+it.h/2;
  const pts=[[-lw/2,lh/2],[lw/2,lh/2],[lw/2,lh/2+t.cl],[-lw/2,lh/2+t.cl]].map(p=>rp(p[0],p[1],it.rot||0));
  const xs=pts.map(p=>p[0]+cx),ys=pts.map(p=>p[1]+cy);
  return {x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
}
const ov=(a,b,t=5)=>Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x)>t&&Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y)>t;
const solidWalls=()=>items.filter(o=>o.kind==='wall'&&!o.demo);
function issues(it){
  const out=[];if(it.kind!=='fix'||it.demo||(!it.nieuw&&!it.moved))return out;
  const ws=solidWalls();
  if(ws.some(w=>ov(w,it,10)))out.push('Staat (deels) in een muur.');
  const c=clrBox(it);
  if(c){
    if(ws.some(w=>ov(w,c,10)))out.push(`Te krap: er is ${T[it.type].cl/10} cm vrije ruimte nodig, maar er staat een muur.`);
    items.filter(o=>o.kind==='fix'&&o!==it&&!o.demo&&ov(o,c,10)).forEach(o=>out.push(`Vrije ruimte overlapt met ${o.label||T[o.type].n}.`));
  }
  return out;
}
function nearestWalls(it){
  const r={l:null,r:null,t:null,b:null};
  for(const w of solidWalls()){ if(w===it)continue;
    if(w.y<it.y+it.h-1&&w.y+w.h>it.y+1){
      if(w.x+w.w<=it.x+1&&(r.l===null||w.x+w.w>r.l))r.l=w.x+w.w;
      if(w.x>=it.x+it.w-1&&(r.r===null||w.x<r.r))r.r=w.x;}
    if(w.x<it.x+it.w-1&&w.x+w.w>it.x+1){
      if(w.y+w.h<=it.y+1&&(r.t===null||w.y+w.h>r.t))r.t=w.y+w.h;
      if(w.y>=it.y+it.h-1&&(r.b===null||w.y<r.b))r.b=w.y;}
  }
  return r;
}
function nearestDrain(it){
  const cx=it.x+it.w/2,cy=it.y+it.h/2;let best=null;
  items.filter(o=>o.kind==='marker'&&o.m==='afvoer').forEach(m=>{
    const d=Math.hypot(m.x+m.w/2-cx,m.y+m.h/2-cy);if(!best||d<best.d)best={d,m}});
  return best;
}

/* ---------- tekenen ---------- */
let K=10;
function fixShape(it,lw,lh){
  const t=T[it.type]||{},sh=t.shape||it.type,c=`fx${t.wet?' wet':''}${it.demo?' demo':''}`;
  const X=-lw/2,Y=-lh/2;let s=`<rect class="${c}" x="${X}" y="${Y}" width="${lw}" height="${lh}"/>`;
  if(sh==='toilet'){const th=lh*.28;s=`<rect class="${c}" x="${X+lw*.05}" y="${Y}" width="${lw*.9}" height="${th}"/><ellipse class="${c}" cx="0" cy="${Y+th+(lh-th)/2}" rx="${lw*.42}" ry="${(lh-th)/2*.96}"/>`}
  else if(sh==='wastafel'){s+=`<ellipse class="${c}" cx="0" cy="${lh*.06}" rx="${lw*.36}" ry="${lh*.3}"/><circle class="${c}" cx="0" cy="${Y+lh*.12}" r="${Math.min(lw,lh)*.05}"/>`}
  else if(sh==='wastafel2'){[-1,1].forEach(k=>s+=`<ellipse class="${c}" cx="${k*lw/4}" cy="${lh*.06}" rx="${lw*.18}" ry="${lh*.3}"/>`)}
  else if(sh==='douche'){s+=`<path class="${c}" d="M${X} ${Y}L${-X} ${-Y}M${-X} ${Y}L${X} ${-Y}"/><circle class="${c}" r="45"/>`}
  else if(sh==='inloop'){s+=`<line class="${c}" x1="${X+60}" y1="${Y+120}" x2="${-X-60}" y2="${Y+120}"/><line class="${c}" style="stroke-width:3px" x1="${X}" y1="${-Y}" x2="${X+lw*.55}" y2="${-Y}"/>`}
  else if(sh==='bad'){s=`<rect class="${c}" x="${X}" y="${Y}" width="${lw}" height="${lh}" rx="60"/><rect class="${c}" x="${X+70}" y="${Y+70}" width="${lw-140}" height="${lh-140}" rx="${Math.min(lh,lw)*.32}"/><circle class="${c}" cx="${X+220}" cy="0" r="35"/>`}
  else if(sh==='wm'||sh==='droger'){const r=Math.min(lw,lh)*.32;s+=`<circle class="${c}" r="${r}"/>`+(sh==='droger'?`<circle class="${c}" r="${r*.45}"/>`:'')}
  else if(sh==='radiator'){for(let i=1;i<5;i++)s+=`<line class="${c}" x1="${X+lw*i/5}" y1="${Y}" x2="${X+lw*i/5}" y2="${-Y}"/>`}
  else if(sh==='aanrecht'){s+=`<line class="${c}" x1="${X}" y1="${-Y-40}" x2="${-X}" y2="${-Y-40}"/>`}
  else if(sh==='kast'){s+=`<path class="${c}" d="M${X} ${Y}L${-X} ${-Y}M${-X} ${Y}L${X} ${-Y}"/>`}
  return s;
}
function txt(x,y,s,size,cls,rot){return `<text class="${cls}" x="${x}" y="${y}" font-size="${size}" text-anchor="middle" dominant-baseline="middle"${rot?` transform="rotate(${rot} ${x} ${y})"`:''}>${esc(s)}</text>`}
const fmt=n=>Math.round(n).toLocaleString('nl-NL');
function render(){
  const bw=svg.clientWidth||800,bh=svg.clientHeight||600;
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  K=Math.max(vb.w/bw,vb.h/bh);
  const P=[];
  P.push(`<rect x="-20000" y="-20000" width="48000" height="48000" fill="url(#grid)"/>`);
  if(opts.ghost)BASE.filter(o=>o.kind==='wall').forEach(o=>P.push(`<rect class="ghost" x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}"/>`));
  const rooms=items.filter(o=>o.kind==='room');
  rooms.forEach(o=>P.push(`<rect class="roomf" x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" style="pointer-events:none"/>`));
  P.push(txt(3415,-3150,'TUIN',11*K,'orient')+txt(3415,10450,'STRAAT',11*K,'orient'));
  rooms.forEach(o=>{if(o.w/K<40||o.h/K<30)return;const cx=o.x+o.w/2,cy=o.y+o.h/2,vert=o.w<o.h*.5&&o.w/K<90;
    const a=(o.w*o.h/1e6).toLocaleString('nl-NL',{maximumFractionDigits:1});
    if(vert){P.push(`<g data-id="${o.id}">${txt(cx,cy,`${o.label} · ${a} m²`,11*K,'roomtxt',-90)}</g>`);return}
    const lw=Math.max(o.label.length*6.6,44)*K,lh=30*K,fx=items.filter(f=>f.kind==='fix'&&!f.demo);
    let best=null;const pad=6*K;
    for(const y of [cy,o.y+o.h*.72,o.y+o.h*.28])for(const x of [cx,o.x+lw/2+pad,o.x+o.w-lw/2-pad]){
      if(lw>o.w-pad)continue;if(!fx.some(f=>ov(f,{x:x-lw/2,y:y-lh/2,w:lw,h:lh},1))){best=[x,y];break}}
    if(!best)return;const[lx,ly]=best;
    P.push(`<g data-id="${o.id}">${txt(lx,ly-7*K,o.label,12*K,'roomtxt')}${txt(lx,ly+8*K,a+' m²',10*K,'roomarea')}</g>`)});
  if(opts.clr)items.filter(o=>o.kind==='fix').forEach(o=>{const c=clrBox(o);if(c)P.push(`<rect class="clr${issues(o).length?' bad':''}" x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}"/>`)});
  items.filter(o=>o.kind==='wall').forEach(o=>P.push(`<g data-id="${o.id}"><rect class="wall${o.bear?' bear':''}${o.nieuw?' new':''}${o.demo?' demo':''}" x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}"/><rect class="hit" x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}"/></g>`));
  items.filter(o=>o.kind==='door'||o.kind==='window').forEach(o=>{
    const {lw,lh}=loc(o),cx=o.x+o.w/2,cy=o.y+o.h/2,lc=o.demo?' demo':(o.nieuw?' new':'');let s='';
    if(o.kind==='window'){
      if(!o.demo)s+=`<rect class="gap" x="${-lw/2}" y="${-lh/2}" width="${lw}" height="${lh}"/>`;
      s+=`<rect class="ln${lc}" x="${-lw/2}" y="${-lh/2}" width="${lw}" height="${lh}"/><line class="ln thin${lc}" x1="${-lw/2}" y1="${-lh*.12}" x2="${lw/2}" y2="${-lh*.12}"/><line class="ln thin${lc}" x1="${-lw/2}" y1="${lh*.12}" x2="${lw/2}" y2="${lh*.12}"/>`;
    }else{
      const fx=o.flip?-1:1,hx=-lw/2*fx,hy=lh/2;
      if(!o.demo)s+=`<rect class="gap" x="${-lw/2}" y="${-lh/2}" width="${lw}" height="${lh}"/>`;
      s+=`<line class="ln${lc}" x1="${-lw/2}" y1="${-lh/2}" x2="${-lw/2}" y2="${lh/2}"/><line class="ln${lc}" x1="${lw/2}" y1="${-lh/2}" x2="${lw/2}" y2="${lh/2}"/>`;
      if(o.slide)s+=`<rect class="ln${lc}" x="${-lw/2+lw*0.0}" y="${lh/2}" width="${lw}" height="40"/><path class="ln thin${lc}" d="M${-lw*.25} ${lh/2+110}H${lw*.25}M${lw*.25-60} ${lh/2+70}L${lw*.25} ${lh/2+110}L${lw*.25-60} ${lh/2+150}"/>`;
      else s+=`<line class="ln${lc}" x1="${hx}" y1="${hy}" x2="${hx}" y2="${hy+lw}"/><path class="ln thin${lc}" d="M${hx} ${hy+lw}A${lw} ${lw} 0 0 ${fx>0?0:1} ${-hx} ${hy}"/>`;
    }
    P.push(`<g data-id="${o.id}"><g transform="translate(${cx} ${cy}) rotate(${o.rot||0})">${s}</g><rect class="hit" x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}"/></g>`);
  });
  items.filter(o=>o.kind==='fix').forEach(o=>{
    const {lw,lh}=loc(o),cx=o.x+o.w/2,cy=o.y+o.h/2;
    let label='';const fs=10*K;
    if(Math.max(lw,lh)/K>46){const vert=o.w<o.h&&o.w/K<46;label=txt(cx,cy,o.label||T[o.type].n,fs,'fxt',vert?-90:0)}
    P.push(`<g data-id="${o.id}"><g transform="translate(${cx} ${cy}) rotate(${o.rot||0})">${fixShape(o,lw,lh)}</g>${label}<rect class="hit" x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}"/></g>`);
    if(issues(o).length)P.push(`<rect class="badbox" x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}"/>`);
  });
  items.filter(o=>o.kind==='marker').forEach(o=>{const cx=o.x+o.w/2,cy=o.y+o.h/2,r=Math.max(70,6*K),showL=K<11||o.id===sel||/standleiding/i.test(o.label||'');
    P.push(`<g data-id="${o.id}"><circle class="mk ${o.m}" cx="${cx}" cy="${cy}" r="${r}"/>${showL?`<text class="mkt" x="${cx+r+4*K}" y="${cy}" font-size="${9*K}" dominant-baseline="middle">${esc(o.label)}</text>`:''}<circle class="hit" cx="${cx}" cy="${cy}" r="${r*1.4}"/></g>`)});
  const s=sel&&byId(sel);
  if(s){
    P.push(`<rect class="selbox" x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}"/>`);
    if(opts.dims&&s.kind!=='room'){
      const n=nearestWalls(s),cx=s.x+s.w/2,cy=s.y+s.h/2,fs=10*K,tk=5*K;
      const hl=(x1,x2,y)=>{if(x2-x1<1||x2-x1>9000)return;P.push(`<path class="dim" d="M${x1} ${y}H${x2}M${x1} ${y-tk}V${y+tk}M${x2} ${y-tk}V${y+tk}"/>`+txt((x1+x2)/2,y-8*K,fmt((x2-x1)/10),fs,'dimt'))};
      const vl=(y1,y2,x)=>{if(y2-y1<1||y2-y1>9000)return;P.push(`<path class="dim" d="M${x} ${y1}V${y2}M${x-tk} ${y1}H${x+tk}M${x-tk} ${y2}H${x+tk}"/>`+txt(x+6*K,(y1+y2)/2,fmt((y2-y1)/10),fs,'dimt',-90))};
      if(n.l!==null)hl(n.l,s.x,cy); if(n.r!==null)hl(s.x+s.w,n.r,cy);
      if(n.t!==null)vl(n.t,s.y,cx); if(n.b!==null)vl(s.y+s.h,n.b,cx);
      if(s.kind!=='marker'){P.push(txt(cx,s.y-12*K,`${fmt(s.w/10)} × ${fmt(s.h/10)} cm`,fs,'dimt'))}
    }
    const rs=s.kind==='room'||s.kind==='wall'||s.kind==='door'||s.kind==='window'||(s.kind==='fix'&&T[s.type]?.rs);
    if(rs&&!(opts.lock&&s.kind==='wall')){const hs=(isMob()?9:6)*K,lin=s.kind!=='room'&&s.kind!=='fix',hor=s.w>=s.h;
      [['n',s.x+s.w/2,s.y],['s',s.x+s.w/2,s.y+s.h],['w',s.x,s.y+s.h/2],['e',s.x+s.w,s.y+s.h/2]]
      .filter(([h])=>!lin||(hor?(h==='e'||h==='w'):(h==='n'||h==='s'))).forEach(([h,x,y])=>P.push(`<rect class="hd" data-h="${h}" x="${x-hs}" y="${y-hs}" width="${hs*2}" height="${hs*2}" style="cursor:${h==='n'||h==='s'?'ns':'ew'}-resize"/>`))}

  document.getElementById('scaleBar').style.width=(1000/K)+'px';
  document.getElementById('undo').disabled=!hist.length;document.getElementById('redo').disabled=!fut.length;

/* ---------- interactie ---------- */
function toW(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return{x:q.x,y:q.y}}
const sn=v=>Math.round(v/opts.snap)*opts.snap;
function magnet(it){
  const tol=10*K;let bx=null,by=null;
  items.forEach(o=>{if(o===it||o.kind==='room'||o.kind==='marker'||o.demo)return;
    [o.x,o.x+o.w].forEach(t=>[[it.x,0],[it.x+it.w,it.w]].forEach(([e,off])=>{const d=Math.abs(e-t);if(d<tol&&(!bx||d<bx.d))bx={d,v:t-off}}));
    [o.y,o.y+o.h].forEach(t=>[[it.y,0],[it.y+it.h,it.h]].forEach(([e,off])=>{const d=Math.abs(e-t);if(d<tol&&(!by||d<by.d))by={d,v:t-off}}));
  });
  if(bx)it.x=Math.round(bx.v);if(by)it.y=Math.round(by.v);
}
const ptrs=new Map();let drag=null,pinch=null;
svg.addEventListener('pointerdown',e=>{
  svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){drag=null;const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),vb:{...vb},mid:toW({clientX:(a.x+b.x)/2,clientY:(a.y+b.y)/2})};return}
  const w=toW(e);
  if(opts.mode==='meas'){const p={x:sn(w.x),y:sn(w.y)};measure={a:p,b:{...p}};drag={t:'meas'};render();return}
  const h=e.target.closest('[data-h]');
  if(h&&sel){const it=byId(sel);drag={t:'rs',h:h.dataset.h,it,o:{...it},w,pushed:false};return}
  const g=e.target.closest('[data-id]');
  if(g){const it=byId(g.dataset.id);if(sel!==it.id){sel=it.id;insCollapsed=false;panel()}
    const locked=opts.lock&&it.kind==='wall';
    drag={t:locked?'pan':'mv',locked,it,o:{x:it.x,y:it.y},w,c:{x:e.clientX,y:e.clientY},vb:{...vb},pushed:false};render();return}
  if(sel){sel=null;if(isMob())insCollapsed=true;panel()}
  drag={t:'pan',c:{x:e.clientX,y:e.clientY},vb:{...vb}};render();
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const f=pinch.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));
    const v=pinch.vb,m=pinch.mid;vb={x:m.x-(m.x-v.x)*f,y:m.y-(m.y-v.y)*f,w:v.w*f,h:v.h*f};render();return}
  if(!drag)return;
  if(drag.t==='pan'){if(!drag.c)return;
    if(drag.locked&&!drag.warned&&Math.hypot(e.clientX-drag.c.x,e.clientY-drag.c.y)>8){drag.warned=true;toast('Muren staan vast. Zet “Muren vast” uit om ze te verschuiven.','Muren vrijgeven',()=>setLock(false))}
    vb.x=drag.vb.x-(e.clientX-drag.c.x)*K;vb.y=drag.vb.y-(e.clientY-drag.c.y)*K;render();return}
  const w=toW(e);
  if(drag.t==='meas'){measure.b={x:sn(w.x),y:sn(w.y)};render();return}
  const it=drag.it,dx=sn(w.x-drag.w.x),dy=sn(w.y-drag.w.y);
  if(!drag.pushed){if(Math.hypot(e.clientX-(drag.c?drag.c.x:e.clientX),e.clientY-(drag.c?drag.c.y:e.clientY))<3&&drag.t==='mv')return;snapshot();drag.pushed=true}
  it.moved=true;
  if(drag.t==='mv'){it.x=drag.o.x+dx;it.y=drag.o.y+dy;if(e.altKey!==true)magnet(it)}
  else{const o=drag.o,mn=50;
    if(drag.h==='e')it.w=Math.max(mn,o.w+dx);
    if(drag.h==='s')it.h=Math.max(mn,o.h+dy);
    if(drag.h==='w'){const nw=Math.max(mn,o.w-dx);it.x=o.x+o.w-nw;it.w=nw}
    if(drag.h==='n'){const nh=Math.max(mn,o.h-dy);it.y=o.y+o.h-nh;it.h=nh}}
  render();panelLive();
});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(drag&&drag.pushed){save();panel()}
  else if(drag&&drag.it&&drag.c&&!drag.warned&&Math.hypot(e.clientX-drag.c.x,e.clientY-drag.c.y)<8)ensureVisible(drag.it);
  drag=null}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(toW(e),Math.exp(e.deltaY*0.0015))},{passive:false});
function zoomAt(p,f){vb={x:p.x-(p.x-vb.x)*f,y:p.y-(p.y-vb.y)*f,w:vb.w*f,h:vb.h*f};render()}
function fit(){const b={x:-700,y:-3300,w:8300,h:13900};const bw=svg.clientWidth||800,bh=svg.clientHeight||600;
  const k=Math.max(b.w/bw,b.h/bh)*1.04,W_=bw*k,H_=bh*k;vb={x:b.x+b.w/2-W_/2,y:b.y+b.h/2-H_/2,w:W_,h:H_};render()}
document.getElementById('zin').onclick=()=>zoomAt({x:vb.x+vb.w/2,y:vb.y+vb.h/2},0.8);
document.getElementById('zout').onclick=()=>zoomAt({x:vb.x+vb.w/2,y:vb.y+vb.h/2},1.25);
document.getElementById('zfit').onclick=fit;

/* ---------- acties ---------- */
function ensureVisible(it){
  if(!it||!isMob())return;const bw=svg.clientWidth,bh=svg.clientHeight,ox=(bw-vb.w/K)/2,oy=(bh-vb.h/K)/2;
  const sx=(it.x+it.w/2-vb.x)/K+ox,sy=(it.y+it.h/2-vb.y)/K+oy,maxY=bh*0.5;
  if(sy>maxY||sy<40||sx<30||sx>bw-30){vb.x+=(sx-bw/2)*K;vb.y+=(sy-bh*0.3)*K;render()}
}
function setLock(v){opts.lock=v;document.getElementById('tLock').classList.toggle('on',v);render();panel()}
function rotate(it){snapshot();it.moved=true;const cx=it.x+it.w/2,cy=it.y+it.h/2;[it.w,it.h]=[it.h,it.w];it.x=Math.round(cx-it.w/2);it.y=Math.round(cy-it.h/2);if(it.kind!=='wall'&&it.kind!=='room')it.rot=((it.rot||0)+90)%360;commit()}
function dup(it){snapshot();const c={...clone(it),id:nid(),x:it.x+300,y:it.y+300,nieuw:true};items.push(c);sel=c.id;commit()}
function del(it){snapshot();items=items.filter(o=>o!==it);sel=null;if(isMob())insCollapsed=true;commit();toast(`${it.label||'Element'} verwijderd.`,'Ongedaan maken',undo)}
function addAtCenter(o){snapshot();o.id=nid();o.nieuw=true;const cy=vb.y+vb.h*(isMob()?0.3:0.5),cx=vb.x+vb.w/2,blk=items.filter(i=>(i.kind==='wall'||i.kind==='fix')&&!i.demo);
  o.x=sn(cx-o.w/2);o.y=sn(cy-o.h/2);
  if(o.kind==='fix'||o.kind==='marker'){outer:for(let r=0;r<=4000;r+=150)for(let a=0;a<(r?12:1);a++){const t={x:sn(cx-o.w/2+r*Math.cos(a*Math.PI/6)),y:sn(cy-o.h/2+r*Math.sin(a*Math.PI/6)),w:o.w,h:o.h};
    if(!blk.some(b=>ov(b,t,1))){o.x=t.x;o.y=t.y;break outer}}}items.push(o);sel=o.id;insCollapsed=false;document.getElementById('lib').classList.remove('open');commit();
  toast(v3.on?`${o.label} toegevoegd. Schuif het in 2D naar de juiste plek.`:`${o.label} toegevoegd. Sleep het naar de juiste plek.`)}
window.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select'))return;
  const mod=e.ctrlKey||e.metaKey,it=sel&&byId(sel);
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(!it){if(e.key==='Escape'){measure=null;render()}return}
  if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();dup(it);return}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();del(it);return}
  if(e.key==='r'||e.key==='R'){rotate(it);return}
  if(e.key==='Escape'){sel=null;commit();return}
  const st=e.shiftKey?opts.snap*10:opts.snap,mv={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
  if(mv){e.preventDefault();if(opts.lock&&it.kind==='wall')return;snapshot();it.x+=mv[0];it.y+=mv[1];commit()}
});

/* ---------- bibliotheek-paneel ---------- */
function buildLib(){
  const cats={};Object.entries(T).forEach(([k,t])=>(cats[t.cat]=cats[t.cat]||[]).push([k,t]));
  const icon=(inner,w,h)=>{const m=Math.max(w,h)*1.12;return `<svg class="ic" viewBox="${-m/2} ${-m*.42} ${m} ${m*.84}" aria-hidden="true">${inner}</svg>`};
  const cm=(a,b)=>`${a/10}×${b/10}`;
  let h=`<p class="hint" style="margin:0 0 4px">Tik op een onderdeel om het toe te voegen. Maten in centimeters.</p>`;
  Object.entries(cats).forEach(([c,list])=>{h+=`<h3>${c}</h3><div class="libgrid">`+list.map(([k,t])=>`<button class="li" data-fx="${k}">${icon(fixShape({type:k},t.w,t.h),t.w,t.h)}<span class="nm">${t.n}</span><span>${cm(t.w,t.h)}</span></button>`).join('')+'</div>'});
  const bi=b=>b.k==='wall'?`<rect class="wall new" x="-${b.w/2}" y="-60" width="${b.w}" height="120"/>`:b.k==='room'?`<rect class="roomf" x="-${b.w/2}" y="-${b.h/2}" width="${b.w}" height="${b.h}" style="stroke:var(--ink2)"/>`:`<rect class="wall" x="-${b.w/2}" y="-60" width="${b.w}" height="120"/><rect class="gap" x="-${b.w*.35}" y="-61" width="${b.w*.7}" height="122"/>`+(b.k==='door'&&!b.slide?`<path class="ln" d="M${-b.w*.35} 60V${b.w*.6}A${b.w*.7} ${b.w*.7} 0 0 0 ${b.w*.35} 60"/>`:'');
  h+=`<h3>Bouw</h3><div class="libgrid">`+BOUW.map((b,i)=>`<button class="li" data-b="${i}">${icon(bi(b),b.w,b.k==='room'?b.h:b.w*.9)}<span class="nm">${b.n}</span><span>${cm(b.w,b.h)}</span></button>`).join('')+'</div>';
  h+=`<h3>Leidingen</h3><div class="libgrid">`+MARK.map((m,i)=>`<button class="li" data-m="${i}">${icon(`<circle class="mk ${m.m}" r="90"/>`,400,300)}<span class="nm">${m.n}</span><span></span></button>`).join('')+'</div>';
  h+=`<p class="hint" style="margin-top:14px">Op een computer: <b>R</b> draait, pijltjes schuiven een stap, Shift+pijl tien stappen, Delete verwijdert.</p>`;
  const lib=document.getElementById('lib');lib.innerHTML=h;
  lib.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.fx){const t=T[b.dataset.fx];addAtCenter({kind:'fix',type:b.dataset.fx,label:t.n,w:t.w,h:t.h,rot:0})}
    else if(b.dataset.b){const t=BOUW[+b.dataset.b];addAtCenter({kind:t.k,label:t.n,w:t.w,h:t.h,rot:0,slide:!!t.slide,bear:false})}
    else if(b.dataset.m){const t=MARK[+b.dataset.m];addAtCenter({kind:'marker',m:t.m,label:t.n,w:220,h:220})}};
}
document.getElementById('libBtn').onclick=()=>document.getElementById('lib').classList.toggle('open');

/* ---------- eigenschappen-paneel ---------- */
const KIND={wall:'wand',door:'deur',window:'raam / pui',room:'ruimte',fix:'inrichting',marker:'leidingpunt'};
function panel(){
  const P=document.getElementById('insp'),it=sel&&byId(sel);
  P.classList.toggle('collapsed',insCollapsed);
  let h=`<button class="mobhandle" id="mh">${insCollapsed?'▲ Overzicht en opties':'▼ Inklappen'}</button>`;
  if(!it){h+=overview()}
  else{
    const kind=it.kind==='fix'?(T[it.type]?.n||'inrichting'):KIND[it.kind];
    const isW=it.kind==='wall';
    h+=`<div class="ih"><div><div class="kind">${esc(kind)}${it.nieuw?' · nieuw':''}</div><h2>${esc(it.label||kind)}</h2></div></div>
    <div class="row">`;
    if(it.kind!=='marker')h+=`<button class="pill" data-a="rot">Draai 90°</button>`;
    if(it.kind==='door')h+=`<button class="pill" data-a="flip">Spiegel</button>`;
    if(isW)h+=`<button class="pill${it.bear?' on':''}" data-a="bear">Dragend</button>`;
    if(it.kind!=='room'&&it.kind!=='marker')h+=`<button class="pill${it.demo?' on':''}" data-a="demo">${it.kind==='door'||it.kind==='window'?'Dichtzetten':'Slopen'}</button>`;
    h+=`<button class="pill" data-a="dup">Dupliceer</button><button class="pill danger" data-a="del">Verwijder</button></div>`;
    if(isW&&opts.lock)h+=`<div class="callout"><b>Muren staan vast</b>Zo schuif je ze niet per ongeluk mee. Slopen kan wel. Wil je deze wand verplaatsen of inkorten? <div class="row"><button class="pill primary" data-a="unlock">Muren vrijgeven</button></div></div>`;
    h+=`<div class="facts" id="facts">${facts(it)}</div>`;
    h+=`<details class="pos"><summary>Naam en exacte maten aanpassen</summary><div class="fields">
      <div class="f full"><label for="p-label">Naam</label><input id="p-label" value="${esc(it.label||'')}"></div>
      ${it.kind!=='marker'?`<div class="f"><label for="p-w">Breedte (mm)</label><input id="p-w" type="number" step="${opts.snap}" min="20" value="${Math.round(it.w)}"></div>
      <div class="f"><label for="p-h">Diepte (mm)</label><input id="p-h" type="number" step="${opts.snap}" min="20" value="${Math.round(it.h)}"></div>`:''}
      <div class="f"><label for="p-x">Positie links → rechts</label><input id="p-x" type="number" step="${opts.snap}" value="${Math.round(it.x)}"></div>
      <div class="f"><label for="p-y">Positie tuin → straat</label><input id="p-y" type="number" step="${opts.snap}" value="${Math.round(it.y)}"></div>
    </div><p class="hint">Posities in mm, gemeten vanaf de binnenkant van de linkermuur en de achtergevel.</p></details>`;
    if(isW&&it.bear&&it.demo)h+=`<div class="warn">Dragende wand slopen vraagt om een constructieberekening en meestal een vergunning.</div>`;
  }
  P.innerHTML=h;
  document.getElementById('mh').onclick=()=>{insCollapsed=!insCollapsed;panel()};
  if(!it){wireOverview();return}
  const num=(id,key)=>{const el=document.getElementById(id);if(!el)return;el.onchange=()=>{const v=parseFloat(el.value);if(isNaN(v))return;snapshot();it.moved=true;if(key==='w'||key==='h'){const cx=it.x;it[key]=Math.max(20,v);it.x=cx}else it[key]=v;commit()}};
  num('p-x','x');num('p-y','y');num('p-w','w');num('p-h','h');
  const lb=document.getElementById('p-label');lb.onchange=()=>{snapshot();it.label=lb.value;commit()};
  P.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
    if(a==='rot')return rotate(it); if(a==='dup')return dup(it); if(a==='del')return del(it); if(a==='unlock')return setLock(false);
    snapshot();if(a==='flip')it.flip=!it.flip;if(a==='bear')it.bear=!it.bear;if(a==='demo')it.demo=!it.demo;commit()});
}
function facts(it){
  let h='';
  if(it.kind==='room'||it.kind==='fix')h+=`<div class="fact"><span>Oppervlak</span><b>${(it.w*it.h/1e6).toLocaleString('nl-NL',{maximumFractionDigits:2})} m²</b></div>`;
  if(it.kind==='wall')h+=`<div class="fact"><span>Lengte</span><b>${fmt(Math.max(it.w,it.h)/10)} cm</b></div>`;
  if(it.kind==='fix'&&T[it.type]?.cl)h+=`<div class="fact"><span>Vrije ruimte ervoor</span><b>${T[it.type].cl/10} cm</b></div>`;
  if(it.kind==='fix'&&T[it.type]?.wet){const d=nearestDrain(it);if(d){h+=`<div class="fact"><span>Tot ${esc(d.m.label)}</span><b>${(d.d/1000).toLocaleString('nl-NL',{maximumFractionDigits:1})} m</b></div>`;
    if(it.type.startsWith('toilet'))h+=`<p class="hint">Bij ±1 cm/m afschot zakt de afvoer over deze afstand ongeveer ${Math.ceil(d.d/1000)} cm. Hoe dichter bij de standleiding, hoe minder je de vloer open hoeft.</p>`}}
  const n=nearestWalls(it),parts=[];
  if(n.l!==null)parts.push(['links',it.x-n.l]);if(n.r!==null)parts.push(['rechts',n.r-it.x-it.w]);
  if(n.t!==null)parts.push(['achter',it.y-n.t]);if(n.b!==null)parts.push(['voor',n.b-it.y-it.h]);
  if(it.kind!=='room'&&parts.length){const ar={links:'← links',rechts:'rechts →',achter:'↑ tuinzijde',voor:'↓ straatzijde'};
    h+=`<div><div class="hint">Afstand tot de muur (cm)</div><div class="dist">${parts.map(p=>`<div><small>${ar[p[0]]}</small>${(Math.round(p[1]/10)).toLocaleString('nl-NL')}</div>`).join('')}</div></div>`}
  const is=issues(it);
  if(it.kind==='fix')h+=is.length?is.map(s=>`<div class="warn">${esc(s)}</div>`).join(''):(T[it.type]?.cl?`<div class="okmsg">Vrije ruimte is vrij.</div>`:'');
  return h;
}
function panelLive(){const f=document.getElementById('facts'),it=sel&&byId(sel);if(f&&it){f.innerHTML=facts(it);['x','y','w','h'].forEach(k=>{const el=document.getElementById('p-'+k);if(el)el.value=Math.round(it[k])})}}
function overview(){
  const isBase=store.cur===BASE_NAME;
  const demo=items.filter(o=>o.kind==='wall'&&o.demo).reduce((s,o)=>s+Math.max(o.w,o.h),0);
  const neu=items.filter(o=>o.kind==='wall'&&o.nieuw&&!o.demo).reduce((s,o)=>s+Math.max(o.w,o.h),0);
  const bearDemo=items.filter(o=>o.kind==='wall'&&o.demo&&o.bear).length;
  const prob=items.filter(o=>o.kind==='fix'&&issues(o).length);
  const rooms=items.filter(o=>o.kind==='room');
  const m1=v=>(v/1000).toLocaleString('nl-NL',{maximumFractionDigits:1});
  let h=`<div class="ih"><div><div class="kind">${isBase?'je kijkt naar':'variant'}</div><h2>${esc(store.cur)}</h2></div></div>`;

/* materialen: kleuren komen uit de CSS-variabelen */
function clearMats(){Object.values(MAT).forEach(m=>m.dispose());MAT={}}
function mat(k){

  const c=v=>new THREE.Color(cssv(v)),std=(col,o)=>new THREE.MeshStandardMaterial({color:col,roughness:.85,metalness:0,...o});

    wall:()=>std(c('--v3-wall')),ceil:()=>std(c('--v3-wall'),{emissive:c('--v3-wall'),emissiveIntensity:.6}),cut:()=>std(c('--v3-cut')),bear:()=>std(c('--v3-bear')),
    nieuw:()=>std(c('--v3-new')),nieuwtop:()=>std(c('--accent')),bad:()=>std(c('--v3-bad')),
    wood:()=>std(c('--v3-wood')),tile:()=>std(c('--v3-tile'),{roughness:.5}),ktile:()=>std(c('--v3-ktile'),{roughness:.6}),stone:()=>std(c('--v3-stone')),
    porc:()=>std(c('--v3-porc'),{roughness:.25}),appl:()=>std(c('--v3-appl'),{roughness:.45}),metal:()=>std(c('--v3-metal'),{roughness:.35,metalness:.3}),
    cab:()=>std(c('--v3-cab')),dark:()=>std(c('--v3-dark'),{roughness:.5}),door:()=>std(c('--v3-door')),mirror:()=>std(c('--v3-mirror'),{roughness:.1}),
    afvoer:()=>std(c('--v3-afvoer')),water:()=>std(c('--water')),gas:()=>std(c('--v3-gas')),
    grass:()=>std(c('--v3-grass')),pave:()=>std(c('--v3-pave')),street:()=>std(c('--v3-street')),ground:()=>std(c('--v3-ground')),
    glass:()=>trans(c('--water'),.22),bath:()=>trans(c('--water'),.5),
    ghost:()=>trans(c('--accent'),.2),ghosteye:()=>trans(c('--accent'),.05),ghostline:()=>new THREE.LineBasicMaterial({color:c('--accent'),transparent:true,opacity:.8}),
    clr:()=>trans(c('--water'),.22),clrbad:()=>trans(c('--accent'),.3),

/* bouwstenen */
function box(x,z,w,d,y0,y1,mt,ud,par){
  const g=new THREE.BoxGeometry(Math.max(mm(w),.001),Math.max(mm(y1-y0),.001),Math.max(mm(d),.001));
  const m=new THREE.Mesh(g,mt);m.position.set(mm(x+w/2),mm((y0+y1)/2),mm(z+d/2));m.userData=ud||{};
  if(Array.isArray(mt)||!mt.transparent){m.castShadow=true;m.receiveShadow=true}
  (par||house).add(m);return m;
}
const lbox=(g,cx,cz,w,d,y0,y1,mt,ud)=>box(cx-w/2,cz-d/2,w,d,y0,y1,mt,ud,g);
function lcyl(g,cx,cz,rx,rz,y0,y1,mt,ud,front){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(1,1,1,32),mt);m.userData=ud||{};m.castShadow=m.receiveShadow=!mt.transparent;
  if(front){m.rotation.x=Math.PI/2;m.scale.set(mm(rx),mm(rz),mm(rx));m.position.set(mm(cx),mm(y0),mm(cz))}
  else{m.scale.set(mm(rx),mm(y1-y0),mm(rz));m.position.set(mm(cx),mm((y0+y1)/2),mm(cz))}
  g.add(m);return m;
}
function ghostBox(x,z,w,d,y0,y1,ud){
  const m=box(x,z,w,d,y0,y1,mat(v3.eye?'ghosteye':'ghost'),ud);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),mat('ghostline'));e.userData={skip:true};m.add(e);return m;
}
function textPlane(lines,cx,cz,maxW){
  const px=.25,c=document.createElement('canvas'),x=c.getContext('2d'),fam=cssv('--font-ui')||'sans-serif';
  const fnt=l=>`${l.b?600:400} ${Math.round(l.s*px)}px ${fam}`;
  let w=0;lines.forEach(l=>{x.font=fnt(l);w=Math.max(w,x.measureText(l.t).width)});
  const lh=lines.map(l=>l.s*px*1.25);
  c.width=Math.ceil(w+8);c.height=Math.ceil(lh.reduce((a,b)=>a+b,0)+8);
  let y=4;lines.forEach((l,i)=>{x.font=fnt(l);x.fillStyle=l.c;x.textAlign='center';x.textBaseline='top';x.fillText(l.t,c.width/2,y+l.s*px*.1);y+=lh[i]});
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;
  let W=c.width/px,H=c.height/px;if(maxW&&W>maxW){const k=maxW/W;W*=k;H*=k}
  const m=new THREE.Mesh(new THREE.PlaneGeometry(mm(W),mm(H)),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));
  m.rotation.x=-Math.PI/2;m.position.set(mm(cx),.004,mm(cz));m.renderOrder=2;m.userData={skip:true,own:true};house.add(m);
  return {m,w:W,h:H};
}

/* opbouw van de maquette */
function build3d(){
  if(house){house.traverse(o=>{o.geometry&&o.geometry.dispose();if(o.userData.own&&o.material){o.material.map&&o.material.map.dispose();o.material.dispose()}});S3.remove(house)}
  house=new THREE.Group();S3.add(house);
  S3.background=new THREE.Color(cssv('--sheet'));
  const Hc=v3.low&&!v3.eye?H3.laag:H3.plafond;
  // omgeving
  box(-7000,-10000,21000,30000,-60,-40,mat('ground'),{floor:1});
  box(-7000,-10000,21000,9740,-40,-30,mat('grass'),{floor:1});
  box(-7000,10120,21000,1800,-40,-30,mat('pave'),{floor:1});
  box(-7000,11920,21000,8000,-40,-35,mat('street'),{floor:1});
  const ink=cssv('--ink2');
  textPlane([{t:'TUIN',s:420,b:1,c:ink}],3415,-5200).m.position.y=-.02;
  textPlane([{t:'STRAAT',s:420,b:1,c:ink}],3415,13600).m.position.y=-.02;
  // vloeren en namen van ruimtes
  const fx=items.filter(o=>o.kind==='fix'&&!o.demo),lab=cssv('--v3-label');
  items.filter(o=>o.kind==='room').forEach(o=>{
    const l=o.label||'',k=/douche|bad|toilet|wc/i.test(l)?'tile':/keuken/i.test(l)?'ktile':/gang|hal|portaal|entree/i.test(l)?'stone':'wood';
    box(o.x,o.y,o.w,o.h,-30,0,mat(k),{id:o.id,floor:1});
    const a=(o.w*o.h/1e6).toLocaleString('nl-NL',{maximumFractionDigits:1});
    if(v3.eye){const c=box(o.x,o.y,o.w,o.h,H3.plafond,H3.plafond+20,mat('ceil'),{skip:1});c.castShadow=false;return} // plafond bij rondkijken
    const t=textPlane([{t:l,s:230,b:1,c:lab},{t:a+' m²',s:170,c:lab}],0,0,o.w*.85);t.m.material.opacity=.75;
    const cx=o.x+o.w/2,cy=o.y+o.h/2;let best=[cx,cy];
    search:for(const y of [cy,o.y+o.h*.72,o.y+o.h*.28])for(const x of [cx,o.x+t.w/2+150,o.x+o.w-t.w/2-150]){
      if(!fx.some(f=>ov(f,{x:x-t.w/2,y:y-t.h/2,w:t.w,h:t.h},1))){best=[x,y];break search}}
    t.m.position.x=mm(best[0]);t.m.position.z=mm(best[1]);
  });
  // muren met openingen voor deuren en ramen
  const ops=items.filter(o=>o.kind==='door'||o.kind==='window');
  items.filter(o=>o.kind==='wall').forEach(w=>{
    const ud={id:w.id},ax=w.w>=w.h,a0=ax?w.x:w.y,a1=ax?w.x+w.w:w.y+w.h;
    if(w.demo){if(v3.ghost)ghostBox(w.x,w.y,w.w,w.h,0,Hc,ud);return}
    const top=Hc+(w.nieuw?8:w.bear?4:0),red=v3.eye?wallMats('wall','cut'):wallMats('nieuw','nieuwtop'); // bij rondkijken: zoals het straks echt wordt
    const mt=w.nieuw?red:wallMats('wall',w.bear?'bear':'cut'),fill=red;
    const piece=(s,e,y0,y1,m)=>{y1=Math.min(y1,top);if(e-s<1||y1-y0<1)return;ax?box(s,w.y,e-s,w.h,y0,y1,m,ud):box(w.x,s,w.w,e-s,y0,y1,m,ud)};
    const holes=[];
    ops.forEach(o=>{if((o.w>=o.h)!==ax||!ov(w,o,20))return;
      const s=Math.max(a0,ax?o.x:o.y),e=Math.min(a1,ax?o.x+o.w:o.y+o.h);if(e-s<50)return;
      const full=o.kind==='door'||/deur|pui/i.test(o.label||'');
      holes.push({s,e,o,sill:full?0:H3.borstwering,head:o.kind==='door'?H3.deur:H3.raamboven})});
    holes.sort((a,b)=>a.s-b.s);
    let cur=a0;
    holes.forEach(h=>{if(h.e<=cur)return;const s=Math.max(h.s,cur);piece(cur,s,0,top,mt);
      if(h.o.demo)piece(s,h.e,0,top,fill); // dichtgezet: nieuw stuk muur
      else{piece(s,h.e,0,h.sill,mt);piece(s,h.e,h.head,top,mt);
        if(h.o.kind==='window'){const y1=Math.min(h.head,Hc),t=30;if(y1>h.sill){const gu={id:h.o.id};
          ax?box(s,w.y+w.h/2-t/2,h.e-s,t,h.sill,y1,mat('glass'),gu):box(w.x+w.w/2-t/2,s,t,h.e-s,h.sill,y1,mat('glass'),gu)}}}
      cur=h.e});
    piece(cur,a1,0,top,mt);
  });
  // deurbladen (open zoals op de tekening)
  ops.filter(o=>o.kind==='door'&&!o.demo).forEach(o=>{
    const {lw,lh}=loc(o),g=new THREE.Group(),ud={id:o.id},y1=Math.min(H3.deur-10,Hc);
    g.position.set(mm(o.x+o.w/2),0,mm(o.y+o.h/2));g.rotation.y=-(o.rot||0)*Math.PI/180;house.add(g);
    const fx_=o.flip?-1:1;
    if(o.slide)lbox(g,lw*.45,lh/2+25,lw,40,0,y1,mat('door'),ud);
    else lbox(g,-lw/2*fx_+fx_*20,lh/2+lw/2,40,lw,0,y1,mat('door'),ud);
  });
  // sanitair en inrichting
  items.filter(o=>o.kind==='fix').forEach(o=>{if(!o.demo||v3.ghost)fix3d(o)});
  // vrije ruimte voor sanitair
  if(opts.clr)items.filter(o=>o.kind==='fix').forEach(o=>{const c=clrBox(o);if(!c)return;
    box(c.x,c.y,c.w,c.h,1,6,mat(issues(o).length?'clrbad':'clr'),{skip:1})});
  // leidingpunten
  items.filter(o=>o.kind==='marker').forEach(o=>{const g=new THREE.Group(),ud={id:o.id};g.position.set(mm(o.x+o.w/2),0,mm(o.y+o.h/2));house.add(g);
    const k=o.m==='gas'?'gas':o.m==='water'?'water':'afvoer';
    if(/standleiding/i.test(o.label||''))lcyl(g,0,0,55,55,0,Hc,mat(k),ud);else lcyl(g,0,0,110,110,0,15,mat(k),ud)});
  // gekozen element omlijnen
  house.updateMatrixWorld(true);
  if(sel){const b=new THREE.Box3();house.traverse(o=>{if(o.isMesh&&o.userData.id===sel)b.expandByObject(o)});
    if(!b.isEmpty()){b.expandByScalar(.03);const h=new THREE.Box3Helper(b,new THREE.Color(cssv('--accent')));h.userData={skip:true,own:true};house.add(h)}}
}
function fix3d(o){
  const t=T[o.type]||{},sh=t.shape||o.type,{lw,lh}=loc(o),ud={id:o.id};
  const g=new THREE.Group();g.position.set(mm(o.x+o.w/2),0,mm(o.y+o.h/2));g.rotation.y=-(o.rot||0)*Math.PI/180;house.add(g);
  const over=o.demo?mat('ghost'):issues(o).length?mat('bad'):null,M=k=>over||mat(k);
  const X=-lw/2,Y=-lh/2,b=(cx,cz,w,d,y0,y1,k)=>lbox(g,cx,cz,w,d,y0,y1,M(k),ud);
  const head=()=>{b(0,Y+20,25,25,1000,2050,'metal');lcyl(g,0,Y+170,110,110,2010,2030,M('metal'),ud)};
  if(sh==='toilet'){const th=lh*.28,hang=o.type==='toilet';
    b(0,Y+th/2,lw*.9,th,0,hang?1150:800,hang?'wall':'porc');
    lcyl(g,0,Y+th+(lh-th)/2,lw*.42,(lh-th)/2*.96,hang?220:0,420,M('porc'),ud)}
  else if(sh==='wastafel'||sh==='wastafel2'){
    if(o.type==='fontein'){b(0,0,lw,lh,800,900,'porc')}
    else{b(0,0,lw,lh,450,820,'cab');b(0,0,lw,lh,820,870,'porc')}
    b(0,Y+8,lw*.85,16,1100,1850,'mirror')}
  else if(sh==='douche'){b(0,0,lw,lh,0,40,'porc');head();showerGlass(o,over)}
  else if(sh==='inloop'){b(0,0,lw,lh,0,10,'tile');head();lbox(g,X+lw*.275,-Y-5,lw*.55,10,10,2000,over||mat('glass'),ud)}
  else if(sh==='bad'){b(0,0,lw,lh,0,560,'porc');b(0,0,lw-140,lh-140,560,566,over?'ghost':'bath')}
  else if(sh==='radiator'){b(0,0,lw,lh,300,1500,'metal')}
  else if(sh==='wm'||sh==='droger'){b(0,0,lw,lh,0,850,'appl');lcyl(g,0,-Y,Math.min(lw,lh)*.3,10,480,0,M('dark'),ud,true)}
  else if(sh==='aanrecht'){b(0,10,lw,lh-60,0,100,'dark');b(0,0,lw,lh,100,880,'cab');b(0,10,lw,lh+20,880,920,'dark');
    if(Math.max(lw,lh)>900)b(0,Y+175,lw,350,1500,2250,'cab')}
  else if(sh==='koelkast'){b(0,0,lw,lh,0,1800,'appl')}
  else if(sh==='kast'){const haard=/haard|schoorsteen/i.test(o.label||'');b(0,0,lw,lh,0,haard?(v3.low&&!v3.eye?H3.laag:H3.plafond):2100,haard?'wall':'cab')}
  else b(0,0,lw,lh,0,800,'appl');
}
function showerGlass(o,over){
  const n=nearestWalls(o),near=60,mt=over||mat('glass'),ud={id:o.id},t=8,h=2000;
  const open={l:n.l===null||o.x-n.l>near,r:n.r===null||n.r-o.x-o.w>near,t:n.t===null||o.y-n.t>near,b:n.b===null||n.b-o.y-o.h>near};
  const r=((o.rot||0)%360+360)%360,front={0:'b',90:'l',180:'t',270:'r'}[r]||'b';
  const entry=open[front]?front:['b','l','r','t'].find(k=>open[k]);
  const f=k=>k===entry?.5:1;
  if(open.l)box(o.x,o.y,t,o.h*f('l'),40,h,mt,ud);
  if(open.r)box(o.x+o.w-t,o.y,t,o.h*f('r'),40,h,mt,ud);
  if(open.t)box(o.x,o.y,o.w*f('t'),t,40,h,mt,ud);
  if(open.b)box(o.x,o.y+o.h-t,o.w*f('b'),t,40,h,mt,ud);
}

/* camera */
function fly(pos,tgt,after){
  const p1=new THREE.Vector3(...pos),t1=new THREE.Vector3(...tgt);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){C3.position.copy(p1);O3.target.copy(t1);after&&after();O3.update();return}
  tween={p0:C3.position.clone(),t0:O3.target.clone(),p1,t1,s:performance.now(),d:600,after};
}
function preset(k,instant){
  const wasEye=v3.eye;v3.eye=false;v3.wait=false;v3.view=k;v3.dirty=true;
  const P=fitView({schuin:[5,12,11],boven:[0,1,.0005],tuin:[-3.5,8,-14],straat:[3,7,14]}[k]);
  if(instant){eyeCtl(false);C3.position.set(...P);O3.target.set(CEN.x,0,CEN.z);O3.update()}
  else if(wasEye)fly(P,[CEN.x,0,CEN.z],()=>eyeCtl(false));
  else{eyeCtl(false);fly(P,[CEN.x,0,CEN.z])}
  bar3d();hint3(isMob()?'Sleep om te draaien, knijp om te zoomen. Tik iets aan om het te kiezen.':'Sleep om te draaien, rechtermuisknop om te schuiven, scroll om te zoomen. Klik iets aan om het te kiezen.');
}
// zoek de afstand waarop het hele huis in beeld past
function fitView(d){
  const dir=new THREE.Vector3(...d).normalize(),cam=C3.clone(),t=new THREE.Vector3(CEN.x,0,CEN.z),v=new THREE.Vector3();
  const pts=[];for(const x of [-.2,7])for(const y of [0,mm(v3.low?H3.laag:H3.plafond)])for(const z of [-2.9,10.3])pts.push([x,y,z]);
  let dist=20;
  for(let i=0;i<8;i++){cam.position.copy(t).addScaledVector(dir,dist);cam.lookAt(t);cam.updateMatrixWorld();
    let m=0;pts.forEach(p=>{v.set(...p).project(cam);m=Math.max(m,Math.abs(v.x),Math.abs(v.y)*1.08)});dist*=m/.97}
  return t.clone().addScaledVector(dir,dist).toArray();
}
function walkTo(p){
  const d=new THREE.Vector3().subVectors(O3.target,C3.position);d.y=0;
  if(d.lengthSq()<1e-8)d.set(0,0,-1);d.normalize();
  const y=mm(H3.oog);
  if(!v3.eye){v3.eye=true;v3.dirty=true;eyeCtl(true)}
  v3.wait=false;fly([p.x,y,p.z],[p.x+d.x*.05,y,p.z+d.z*.05]);bar3d();
  hint3('Sleep om rond te kijken. Tik op de vloer om daarheen te lopen.');
}
function pick3d(e){
  if(!house)return;const r=e.target.getBoundingClientRect(),ray=new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),C3);
  const hit=ray.intersectObjects(house.children,true).find(h=>!h.object.userData.skip);
  const ud=hit?hit.object.userData:{};
  if((v3.eye||v3.wait)&&ud.floor){walkTo(hit.point);return}
  if(ud.id){sel=ud.id;insCollapsed=false}else{sel=null;if(isMob())insCollapsed=true}
  render();panel();
}
function hint3(t,ms){const h=document.getElementById('v3hint');h.textContent=t;h.hidden=false;clearTimeout(hintT);hintT=setTimeout(()=>h.hidden=true,ms||6000)}
function bar3d(){
  document.querySelectorAll('[data-v3]').forEach(b=>b.classList.toggle('on',!v3.eye&&!v3.wait&&b.dataset.v3===v3.view));
  const e=document.getElementById('v3eye');e.classList.toggle('on',v3.eye||v3.wait);e.textContent=v3.eye?'Stop met rondkijken':'Rondkijken';
  const lo=document.getElementById('v3low');lo.classList.toggle('on',v3.low);lo.disabled=v3.eye;document.getElementById('v3ghost').classList.toggle('on',v3.ghost);
}
function loop3d(){
  if(!v3.on){v3.raf=0;return}
  v3.raf=requestAnimationFrame(loop3d);
  if(tween){const k=Math.min(1,(performance.now()-tween.s)/tween.d),q=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    C3.position.lerpVectors(tween.p0,tween.p1,q);O3.target.lerpVectors(tween.t0,tween.t1,q);
    if(k>=1){const a=tween.after;tween=null;a&&a()}}
  O3.update();
  if(v3.dirty){v3.dirty=false;build3d()}
  R3.render(S3,C3);
}
async function setView(d3){
  v3.on=d3;document.body.classList.toggle('is3d',d3);
  document.getElementById('v2d').classList.toggle('on',!d3);document.getElementById('v3d').classList.toggle('on',d3);
  document.getElementById('v3').hidden=!d3;
  if(!d3){render();return}
  if(opts.mode==='meas')setMode('sel');
  const msg=document.getElementById('v3msg');
  if(!THREE){msg.hidden=false;msg.textContent='3D-maquette laden…'}
  try{await load3d()}catch(e){console.error(e);msg.hidden=false;msg.textContent='De 3D-weergave kon niet laden. Controleer je internetverbinding en tik nog eens op 3D.';return}
  msg.hidden=true;if(!v3.on)return;
  size3d();v3.dirty=true;
  if(!v3.placed){v3.placed=true;preset('schuin',true)}else bar3d();
  if(!v3.raf)loop3d();
}
document.getElementById('v2d').onclick=()=>setView(false);
document.getElementById('v3d').onclick=()=>setView(true);
document.querySelectorAll('[data-v3]').forEach(b=>b.onclick=()=>preset(b.dataset.v3));
document.getElementById('v3eye').onclick=()=>{
  if(v3.eye){preset('schuin');return}
  v3.wait=!v3.wait;bar3d();
  if(v3.wait)hint3('Tik op de vloer waar je wilt staan.',60000);else document.getElementById('v3hint').hidden=true;
};
document.getElementById('v3low').onclick=()=>{v3.low=!v3.low;v3.dirty=true;bar3d()};
document.getElementById('v3ghost').onclick=()=>{v3.ghost=!v3.ghost;v3.dirty=true;bar3d()};
window.addEventListener('keydown',e=>{if(v3.on&&e.key==='Escape'&&(v3.eye||v3.wait))preset('schuin')});

/* ---------- start ---------- */
buildLib();fillVariants();
new ResizeObserver(()=>render()).observe(svg);
requestAnimationFrame(()=>{fit();panel();let seen=null;try{seen=localStorage.getItem('verbouwplan-intro')}catch(e){}if(!seen)openIntro(0)});
</script>
